<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Opiniones de la comunidad sobre Manarem: leé reseñas y dejá tu opinión sobre animes, mangas y productos.">
    <link rel="stylesheet" href="/static/css/colors.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/header.css">
    <link rel="stylesheet" href="/static/css/footer.css">
    <link rel="stylesheet" href="/static/css/opiniones.css">
    <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
    <title>Opiniones — Manarem</title>
</head>
<body>
    <main>
        <section class="section">
            <div class="container">
                <h2 class="section-title">Opiniones de la comunidad</h2>
                <p class="text-muted">Leé lo que otros usuarios opinan sobre Manarem y compartí tu experiencia.</p>
                <div id="opiniones-list" class="opiniones-list"></div>

                <h3 class="opinion-form-titulo">Deja tu opinion</h3>
                <div id="form-opinion-wrap"></div>
            </div>
        </section>
    </main>
    <script src="/static/js/mock-data.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/components.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        async function cargarOpiniones() {
            const lista = document.getElementById('opiniones-list');
            const opiniones = await api.opiniones.listar();

            if (!Array.isArray(opiniones)) {
                lista.innerHTML = '<div class="login-aviso">No se pudieron cargar las opiniones. '
                    + escaparHtml(opiniones.error || 'Probá de nuevo en un rato.') + '</div>';
                return;
            }

            lista.innerHTML = opiniones.map(op => {
                const nombre = escaparHtml(sinAcentos(op.nombre));
                // El avatar es un nombre de archivo que elige el backend: se lo
                // acota a eso, sin barras ni rutas relativas.
                const avatar = /^[A-Za-z0-9._-]+$/.test(op.avatar || '') ? op.avatar : 'persona1-f.jpg';
                return `
                <article class="opinion-card">
                    <img class="opinion-avatar" src="/static/img/${avatar}" alt="Avatar de ${nombre}">
                    <div class="opinion-body">
                        <header class="opinion-head">
                            <h3>${nombre}</h3>
                            <time datetime="${escaparHtml(op.fecha)}">${escaparHtml(op.fecha)}</time>
                        </header>
                        <p>${escaparHtml(op.texto)}</p>
                    </div>
                </article>`;
            }).join('');
        }

        function setupFormOpinion() {
            const wrap = document.getElementById('form-opinion-wrap');
            const user = checkAuth();
            if (!user) {
                wrap.innerHTML = '<div class="login-aviso">Para dejar tu opinion tenes que <a href="/ingresar">iniciar sesion</a>.</div>';
                return;
            }
            wrap.innerHTML = `
                <div class="opinion-form-card">
                    <form id="formOpinion">
                        <label for="texto">Tu opinion</label>
                        <textarea id="texto" name="texto" rows="4" required></textarea>
                        <button type="submit" class="btn">Enviar opinion</button>
                    </form>
                </div>
            `;

            document.getElementById('formOpinion').addEventListener('submit', async (e) => {
                e.preventDefault();
                const data = {
                    nombre: user.usuario || 'Usuario',
                    texto: document.getElementById('texto').value,
                };
                const result = await api.opiniones.crear(data);
                if (result.error) {
                    showAlert('Error al enviar opinión: ' + result.error, 'error');
                } else {
                    showAlert('¡Opinión enviada correctamente!', 'success');
                    e.target.reset();
                    cargarOpiniones();
                }
            });
        }

        cargarOpiniones();
        setupFormOpinion();
    </script>
</body>
</html>
